<!doctype html>
<html class="theme-dark"><head><meta charset="utf-8"><title>Mindmap harness</title>
<link rel="stylesheet" href="../styles.css">
<style>
:root{--background-primary:#1e1e1e;--background-secondary:#262626;--background-modifier-border:#363636;--background-modifier-hover:rgba(255,255,255,.075);--text-normal:#dadada;--text-muted:#b3b3b3;--text-faint:#666;--text-on-accent:#fff;--interactive-accent:#7f6df2;--color-red:#fb464c;--color-orange:#e9973f;--color-yellow:#e0de71;--color-green:#44cf6e;--color-cyan:#53dfdd;--color-blue:#027aff;--color-purple:#a882ff;--color-pink:#fa99cd;--font-text:-apple-system,sans-serif;--font-interface:-apple-system,sans-serif;--radius-s:4px;--radius-m:8px;--shadow-s:0 1px 3px rgba(0,0,0,.4);--shadow-l:0 8px 24px rgba(0,0,0,.5);--font-ui-smaller:12px;--font-ui-small:13px}
html,body{margin:0;height:100%;background:#1e1e1e;color:#dadada;font-family:-apple-system,sans-serif}
#app{position:absolute;inset:0;display:flex}
.workspace-leaf-content{flex:1;display:flex;flex-direction:column}
.view-header{height:40px;line-height:40px;padding:0 16px;border-bottom:1px solid #333}
.view-content{flex:1;position:relative}
.menu{background:#2a2a2a;border:1px solid #444;border-radius:6px;padding:4px;min-width:160px}
.menu-item{padding:4px 8px;cursor:pointer;border-radius:4px}.menu-item:hover{background:#3a3a3a}
</style></head>
<body><div id="app"></div><script src="bundle.js"></script></body></html>
